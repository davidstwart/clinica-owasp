[pytest]
# Configuración de pruebas — ISO/IEC 29119
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    unit: pruebas unitarias (componentes aislados, ISO/IEC 29119 nivel componente)
    integration: pruebas de integración (API + base de datos)
    security: pruebas de seguridad derivadas de OWASP Top 10 2021
    smoke: verificación rápida de arranque
filterwarnings =
    ignore::DeprecationWarning
