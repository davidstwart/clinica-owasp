# SonarQube — Sistema Web Clínica OWASP Top 10 2021
sonar.projectKey=clinica-owasp
sonar.projectName=Clinica-OWASP
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/build/**,**/venv/**,**/*.db,**/*.min.js
sonar.test.exclusions=**/node_modules/**,**/build/**

# Cobertura generada por pytest-cov y react-scripts test --coverage
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.version=3.9,3.10,3.11,3.12,3.13,3.14

# El frontend es una capa de presentación; la lógica de negocio se mide en backend.
sonar.coverage.exclusions=frontend/src/**

# Fallar el comando si el Quality Gate no se cumple.
sonar.qualitygate.wait=true
