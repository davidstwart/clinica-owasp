# Blueprint de Render: API FastAPI + PostgreSQL + sitio estático del frontend.
# Render inyecta RENDER_EXTERNAL_HOSTNAME; backend/src/config.py lo añade a
# TRUSTED_HOSTS automáticamente.
services:
  - type: web
    name: clinica-owasp-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers es necesario porque Render termina TLS en un proxy:
    # sin él, el limitador de tasa y el forzado de HTTPS ven datos erróneos.
    startCommand: 'uvicorn src.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # El plan gratuito de Render no tiene Shell: la semilla corre al arrancar.
      - key: SEED_ON_START
        value: 'true'
      - key: DEBUG
        value: 'false'
      - key: HABILITAR_DOCS
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-owasp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CIFRADO_CLAVE
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://clinica-owasp.vercel.app,https://clinica-owasp-web.onrender.com
      - key: FORZAR_TLS
        value: 'true'
      - key: MFA_EXIGIR_ADMIN
        value: 'true'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '30'
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: RATE_LIMIT_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: clinica-owasp-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    # Fallback para las rutas de React Router (BrowserRouter).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://clinica-owasp-api.onrender.com

databases:
  - name: clinica-owasp-db
    plan: free
    databaseName: clinica_db
    user: clinica_user
